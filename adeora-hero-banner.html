<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Adeora Design Studio hero banner with immersive motion background and polished interactions."
    />
    <title>Adeora Design Studio Hero Banner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'nexora-bg': '#050B14',
              'nexora-gradient': '#02122C'
            },
            fontFamily: {
              inter: ['Inter', 'sans-serif']
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "framer-motion": "https://esm.sh/framer-motion@11.18.2?external=react,react-dom",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
        }
      }
    </script>

    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: #050b14;
      }

      * {
        box-sizing: border-box;
      }

      ::selection {
        color: #050b14;
        background: #ffffff;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { AnimatePresence, motion } from 'framer-motion';
      import { ArrowRight, Menu, Plus, X } from 'lucide-react';

      const h = React.createElement;

      const navItems = ['Home', 'Work', 'Services', 'Contact'];

      const fadeLinkClass =
        'text-sm font-medium text-white transition-colors duration-300 hover:text-white/70';

      function Logo() {
        return h(
          'a',
          {
            href: '#',
            className: 'flex flex-col leading-none text-white',
            'aria-label': 'Adeora Design Studio home'
          },
          h(
            'span',
            {
              className:
                'text-xl font-semibold tracking-wide md:text-2xl'
            },
            'ADEORA'
          ),
          h(
            'span',
            {
              className:
                'mt-1 text-[0.6rem] uppercase tracking-widest text-white/80 md:text-xs'
            },
            'Design Studio'
          )
        );
      }

      function LetsCreateButton({ isMobile = false }) {
        return h(
          'a',
          {
            href: '#contact',
            className:
              'group inline-flex items-center space-x-3 rounded-full px-1 py-1 text-sm font-medium text-white transition-colors duration-300 hover:bg-white/5 ' +
              (isMobile ? 'self-start' : '')
          },
          h('span', null, "Let's Create"),
          h(
            'span',
            {
              className:
                'flex h-8 w-8 items-center justify-center rounded-full border border-white/30 text-white transition-all duration-300 group-hover:border-white group-hover:bg-white group-hover:text-nexora-bg'
            },
            h(Plus, {
              size: 16,
              strokeWidth: 2,
              'aria-hidden': true
            })
          )
        );
      }

      function Navbar() {
        const [isOpen, setIsOpen] = useState(false);

        return h(
          'nav',
          {
            className:
              'relative z-30 flex w-full items-center justify-between px-6 py-6 md:px-12 md:py-8 lg:px-24',
            'aria-label': 'Main navigation'
          },
          h(Logo),
          h(
            'div',
            {
              className: 'hidden items-center space-x-10 lg:flex'
            },
            navItems.map((item) =>
              h(
                'a',
                {
                  key: item,
                  href: '#' + item.toLowerCase(),
                  className: fadeLinkClass
                },
                item
              )
            )
          ),
          h(
            'div',
            {
              className: 'hidden lg:block'
            },
            h(LetsCreateButton)
          ),
          h(
            'button',
            {
              type: 'button',
              className:
                'flex h-11 w-11 items-center justify-center rounded-full border border-white/20 text-white transition-colors duration-300 hover:bg-white/5 lg:hidden',
              'aria-label': isOpen ? 'Close menu' : 'Open menu',
              'aria-expanded': isOpen,
              onClick: () => setIsOpen((value) => !value)
            },
            isOpen
              ? h(X, { size: 22, strokeWidth: 2, 'aria-hidden': true })
              : h(Menu, { size: 22, strokeWidth: 2, 'aria-hidden': true })
          ),
          h(
            AnimatePresence,
            null,
            isOpen &&
              h(
                motion.div,
                {
                  key: 'mobile-menu',
                  initial: { opacity: 0, y: -10 },
                  animate: { opacity: 1, y: 0 },
                  exit: { opacity: 0, y: -10 },
                  transition: { duration: 0.25, ease: 'easeOut' },
                  className:
                    'absolute left-6 right-6 top-full z-50 rounded-3xl border border-white/20 bg-[#050B14]/85 p-5 shadow-2xl shadow-black/30 backdrop-blur-xl md:left-12 md:right-12 lg:hidden'
                },
                h(
                  'div',
                  {
                    className: 'flex flex-col space-y-4'
                  },
                  navItems.map((item) =>
                    h(
                      'a',
                      {
                        key: item,
                        href: '#' + item.toLowerCase(),
                        className:
                          'text-base font-medium text-white transition-colors duration-300 hover:text-white/70',
                        onClick: () => setIsOpen(false)
                      },
                      item
                    )
                  ),
                  h('div', { className: 'pt-2' }, h(LetsCreateButton, { isMobile: true }))
                )
              )
          )
        );
      }

      function HeroContent() {
        return h(
          'main',
          {
            className:
              'flex flex-grow items-center justify-center px-6 text-center md:px-12 lg:px-24'
          },
          h(
            'section',
            {
              className:
                'mx-auto mt-12 flex max-w-4xl flex-col items-center md:mt-16 lg:mt-20',
              'aria-labelledby': 'hero-title'
            },
            h(
              motion.p,
              {
                initial: { opacity: 0, y: 20 },
                animate: { opacity: 1, y: 0 },
                transition: { duration: 0.6, ease: 'easeOut' },
                className:
                  'mb-5 text-xs font-medium uppercase tracking-widest text-white/80 md:text-sm'
              },
              'WE DESIGN EXPERIENCES'
            ),
            h(
              motion.h1,
              {
                id: 'hero-title',
                initial: { opacity: 0, y: 30 },
                animate: { opacity: 1, y: 0 },
                transition: { duration: 0.8, ease: 'easeOut', delay: 0.1 },
                className:
                  'text-5xl font-bold leading-[1.1] tracking-tight text-white md:text-[4.5rem] lg:text-[5.5rem]'
              },
              'Designing Digital ',
              h('br', { className: 'hidden md:block' }),
              'Experiences That Inspire'
            ),
            h(
              motion.p,
              {
                initial: { opacity: 0, y: 20 },
                animate: { opacity: 1, y: 0 },
                transition: { duration: 0.8, ease: 'easeOut', delay: 0.2 },
                className:
                  'mt-6 max-w-2xl text-base font-normal leading-relaxed text-white/80 md:text-lg'
              },
              'Adeora is a design studio crafting refined digital products, immersive brand systems, and meaningful interfaces for ambitious teams.'
            ),
            h(
              motion.a,
              {
                href: '#work',
                initial: { opacity: 0, y: 20 },
                animate: { opacity: 1, y: 0 },
                transition: { duration: 0.8, ease: 'easeOut', delay: 0.3 },
                className:
                  'group mt-10 inline-flex items-center space-x-4 rounded-full border border-white/20 bg-transparent py-2 pl-6 pr-2 text-sm font-medium text-white backdrop-blur-sm transition-colors duration-300 hover:bg-white/5'
              },
              h('span', null, 'View Our Work'),
              h(
                'span',
                {
                  className:
                    'flex h-9 w-9 items-center justify-center rounded-full border border-white/30 text-white transition-all duration-300 group-hover:border-white group-hover:bg-white group-hover:text-nexora-bg'
                },
                h(ArrowRight, {
                  size: 16,
                  strokeWidth: 2,
                  'aria-hidden': true
                })
              )
            )
          )
        );
      }

      function Hero() {
        return h(
          'div',
          {
            className:
              'relative min-h-screen w-full overflow-hidden bg-nexora-bg font-inter'
          },
          h(
            'video',
            {
              className:
                'absolute inset-0 z-0 h-full w-full object-cover pointer-events-none',
              autoPlay: true,
              loop: true,
              muted: true,
              playsInline: true,
              preload: 'auto',
              'aria-hidden': true
            },
            h('source', {
              src: 'https://strvid.nyc3.cdn.digitaloceanspaces.com/motionsite/hero_cloud_animation_video.mp4',
              type: 'video/mp4'
            })
          ),
          h('div', {
            className: 'pointer-events-none absolute inset-0 z-[1] bg-black/20'
          }),
          h('div', {
            className:
              'pointer-events-none absolute bottom-0 left-0 right-0 z-[2] h-[80vh] bg-cover bg-bottom',
            style: {
              backgroundImage:
                "url('https://strvid.nyc3.cdn.digitaloceanspaces.com/motionsite/hero_foreground_bg.png')"
            },
            'aria-hidden': true
          }),
          h('div', {
            className:
              'pointer-events-none absolute bottom-0 left-0 right-0 z-[3] h-[60vh] bg-gradient-to-t from-[#02122c] via-[#02122c]/80 to-transparent',
            'aria-hidden': true
          }),
          h('div', {
            className: 'pointer-events-none absolute inset-0 z-[4]',
            style: {
              background:
                'linear-gradient(to bottom, #02122cff 0%, #02122cfa 10%, #02122c80 25%, transparent 50%)'
            },
            'aria-hidden': true
          }),
          h(
            'div',
            {
              className: 'relative z-10 flex min-h-screen flex-col'
            },
            h(Navbar),
            h(HeroContent)
          )
        );
      }

      function App() {
        return h(Hero);
      }

      const root = createRoot(document.getElementById('root'));
      root.render(h(App));
    </script>
  </body>
</html>
